name: Spring Boot CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # Java - DISABLED
      # ==========================================

      # - name: Setup Java 21
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: temurin
      #     java-version: "21"
      #     cache: maven

      # - name: Make Maven Wrapper executable
      #   run: chmod +x mvnw

      # ==========================================
      # Maven Build & Test - DISABLED
      # ==========================================

      # - name: Build and Test
      #   run: ./mvnw clean verify

      # ==========================================
      # Upload JAR - DISABLED
      # ==========================================

      # - name: Upload JAR
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: spring-boot-application
      #     path: target/*.jar

      # ==========================================
      # SonarQube - DISABLED
      # ==========================================

      # - name: SonarQube Scan
      #   uses: SonarSource/sonarqube-scan-action@v8

      # ==========================================
      # OWASP Dependency-Check - DISABLED
      # ==========================================

      # - name: OWASP Dependency-Check
      #   run: ./mvnw dependency-check:check

      # ==========================================
      # Gitleaks - DISABLED
      # ==========================================

      # - name: Gitleaks Secret Scan
      #   uses: gitleaks/gitleaks-action@v2

      # ==========================================
      # Docker Build - ENABLED
      # ==========================================

      - name: Build Docker Image
        run: |
          docker build -t springboot-mysql-thymeleaf-devsecops:latest .

      # ==========================================
      # Trivy - DISABLED
      # ==========================================

      # - name: Trivy Container Scan
      #   uses: aquasecurity/trivy-action@master

      # ==========================================
      # AWS OIDC - ENABLED
      # ==========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::699960289057:role/github-actions-ecr-role
          aws-region: ap-south-1

      # ==========================================
      # ECR Login - ENABLED
      # ==========================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ==========================================
      # Docker Tag - ENABLED
      # ==========================================

      - name: Tag Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: springboot-mysql-thymeleaf-devsecops
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag springboot-mysql-thymeleaf-devsecops:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag springboot-mysql-thymeleaf-devsecops:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # ==========================================
      # ECR Push - ENABLED
      # ==========================================

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: springboot-mysql-thymeleaf-devsecops
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest