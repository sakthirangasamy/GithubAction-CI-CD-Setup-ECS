
name: Spring Boot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and Test
        run: ./mvnw clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-application
          path: target/*.jar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=sakthirangasamy
            -Dsonar.projectKey=sakthirangasamy_GithubAction-CI-CD-Setup-ECS

      # Dependency-Check temporarily disabled
      # - name: OWASP Dependency-Check
      #   run: |
      #     ./mvnw dependency-check:check

      # - name: Upload Dependency-Check Report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: dependency-check-report
      #     path: target/dependency-check-report

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t springboot-mysql-thymeleaf-devsecops:latest .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: springboot-mysql-thymeleaf-devsecops:latest
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # ==========================================
      # AWS ECR
      # ==========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::699960289057:role/github-actions-ecr-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: springboot-mysql-thymeleaf-devsecops
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag springboot-mysql-thymeleaf-devsecops:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag springboot-mysql-thymeleaf-devsecops:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: springboot-mysql-thymeleaf-devsecops
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

