name: Spring Boot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and Test
        run: ./mvnw clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-application
          path: target/*.jar

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.c89e435c094ead211093b1cf1098ac5878ac8fd8 }}
        run: |
          ./mvnw clean verify sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=sakthirangasamy \
            -Dsonar.projectKey=sakthirangasamy_GithubAction-CI-CD-Setup-ECS \
            -Dsonar.token=$SONAR_TOKEN