spring.application.name=springboot-mysql-thymeleaf-devsecops

# Database (override with environment variables in Docker / ECS)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devsecops_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate (local development settings)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# Actuator: expose only health
management.endpoints.web.exposure.include=health
