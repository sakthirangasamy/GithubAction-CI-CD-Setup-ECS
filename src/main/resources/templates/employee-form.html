<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing} ? 'Edit Employee' : 'Add Employee'">Employee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="app-nav mb-4">
    <div class="container py-3">
        <a class="brand" th:href="@{/employees}">
            <span class="brand-logo"><i class="bi bi-people-fill"></i></span>
            <span>Employee Management</span>
        </a>
    </div>
</nav>

<div class="container form-container pb-5">
    <a th:href="@{/employees}" class="text-decoration-none page-sub d-inline-block mb-3">
        <i class="bi bi-arrow-left"></i> Back to employees
    </a>

    <div class="card-modern fade-up">
        <div class="p-4 p-md-5">
            <h1 class="h4 page-title mb-1" th:text="${editing} ? 'Edit Employee' : 'Add Employee'">Employee</h1>
            <p class="page-sub mb-4"
               th:text="${editing} ? 'Update the details below.' : 'Fill in the details to add a new team member.'"></p>

            <form th:object="${employee}"
                  th:action="${editing} ? @{/employees/edit/{id}(id=${employeeId})} : @{/employees}"
                  method="post" novalidate>

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Jane Doe"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" id="email" th:field="*{email}" class="form-control"
                           placeholder="jane@company.com"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="department" class="form-label">Department</label>
                        <input type="text" id="department" th:field="*{department}" class="form-control"
                               placeholder="Engineering"
                               th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('department')}"
                             th:errors="*{department}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="salary" class="form-label">Salary</label>
                        <input type="number" step="0.01" id="salary" th:field="*{salary}" class="form-control"
                               placeholder="0.00"
                               th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('salary')}"
                             th:errors="*{salary}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary px-4"
                            th:text="${editing} ? 'Update Employee' : 'Save Employee'">Save Employee</button>
                    <a th:href="@{/employees}" class="btn btn-soft px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
