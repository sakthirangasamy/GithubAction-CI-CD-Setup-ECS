<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="app-nav mb-4">
    <div class="container py-3">
        <a class="brand" th:href="@{/employees}">
            <span class="brand-logo"><i class="bi bi-people-fill"></i></span>
            <span>Employee Management</span>
        </a>
    </div>
</nav>

<div class="container pb-5">
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 fade-up">
        <div>
            <h1 class="h3 page-title mb-1">Employees</h1>
            <div class="page-sub">Manage your team members and their details.</div>
        </div>
        <a th:href="@{/employees/new}" class="btn btn-primary px-4 py-2">
            <i class="bi bi-plus-lg me-1"></i> Add Employee
        </a>
    </div>

    <div class="row g-3 mb-4 fade-up">
        <div class="col-sm-6 col-lg-4">
            <div class="card-modern stat-card">
                <div class="stat-icon"><i class="bi bi-person-badge"></i></div>
                <div>
                    <div class="stat-value" th:text="${#lists.size(employees)}">0</div>
                    <div class="stat-label">Total employees</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card-modern fade-up">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center gap-2">
            <div class="search-box w-100">
                <i class="bi bi-search"></i>
                <input type="search" id="search" class="form-control" placeholder="Search employees..."
                       aria-label="Search employees">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-modern" id="employee-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Employee</th>
                    <th>Department</th>
                    <th class="text-end">Salary</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${employees}" class="emp-row">
                    <td class="id-chip" th:text="'#' + ${emp.id}"></td>
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <div class="avatar"
                                 th:text="${#strings.toUpperCase(#strings.substring(emp.name, 0, 1))}">A</div>
                            <div>
                                <div class="fw-semibold" th:text="${emp.name}"></div>
                                <div class="small text-muted" th:text="${emp.email}"></div>
                            </div>
                        </div>
                    </td>
                    <td><span class="badge badge-dept" th:text="${emp.department}"></span></td>
                    <td class="text-end fw-medium"
                        th:text="${#numbers.formatDecimal(emp.salary, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-soft">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a th:href="@{/employees/delete/{id}(id=${emp.id})}" class="btn btn-sm btn-soft-danger"
                           onclick="return confirm('Are you sure you want to delete this employee?');">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="5" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                        No employees yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.getElementById('search').addEventListener('input', function (e) {
        var q = e.target.value.toLowerCase();
        document.querySelectorAll('.emp-row').forEach(function (row) {
            row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
    });
</script>
</body>
</html>
